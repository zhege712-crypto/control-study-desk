name: Deploy study desk to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare verified local browser dependencies
        run: python3 tools/prepare_vendor.py
      - name: Validate the public source
        run: python3 tools/check_release.py
      - name: Check teaching models, formulas and links
        run: node tools/check_models.mjs
      - name: Check expanded worked examples
        run: node tools/check_depth.mjs
      - name: Run downloadable Python teaching example
        run: python3 docs/examples/consensus_demo.py
      - name: Check foundation and research starter fixtures
        run: python3 docs/examples/research_starter.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
